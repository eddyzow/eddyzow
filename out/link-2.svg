<svg xmlns="http://www.w3.org/2000/svg" width="126" height="44" viewBox="0 0 126 44" fill="none" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<style>@font-face{font-family:GM;font-style:normal;src:url(data:font/woff;base64,) format("woff")}.mono{font-family:GM,ui-monospace,monospace;font-style:normal}
@keyframes twinkle{50%{opacity:.2}}
@keyframes roll{to{transform:translateY(var(--to))}}
@keyframes ping{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
@keyframes march{to{stroke-dashoffset:-60}}
.tw{animation:twinkle 3s ease-in-out infinite}
.roll{animation:roll 1.9s cubic-bezier(.16,1,.3,1)}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s cubic-bezier(.16,1,.3,1) infinite}
.march{animation:march 5s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="4" y="4" width="120.5" height="38.5" rx="20" fill="#04031a"/>
<rect x="1.5" y="1.5" width="119" height="37" rx="18.5" fill="#0a0920" stroke="#04031a" stroke-width="3"/>
<text class="mono" x="61" y="24.5" text-anchor="middle" font-size="13" fill="#f3f0ff">LinkedIn ↗</text>
</svg>
